services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: migr8
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    volumes:
      - migr8_pg:/var/lib/postgresql/data

  api:
    build: .
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    env_file: .env
    environment:
      APP_ENV: development
      STORAGE_BACKEND: local
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  migr8_pg:
